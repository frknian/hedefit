// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // DİKKAT: buildscript bloğu variables.gradle'dan ÖNCE çalışır, bu yüzden
    // Kotlin eklentisinin sürümü orada değil BURADA tanımlanır. İki yerde
    // tutmak sessizce sürüm uyuşmazlığı üretirdi.
    // 2.3.21 — LiteRT-LM 0.16.1 Kotlin metadata 2.3.0 ile derlenmiştir;
    // daha eski bir derleyici (2.1/2.2) onu "incompatible metadata version"
    // hatasıyla OKUYAMAZ. Sürüm bu yüzden çalışma zamanının dayattığı taban.
    ext.kotlinVersion = '2.3.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Cihaz üstü AI köprüsü (LiteRT-LM) Kotlin ile yazıldı: LiteRT-LM'in
        // Android API'si coroutine/Flow tabanlıdır ve Java'dan kullanmak
        // callback sarmalayıcıları gerektirirdi. Sürüm SABİTLENMİŞTİR.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
