name: Hedefit
options:
  bundleIdPrefix: com.hedefit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.2.11
    CURRENT_PROJECT_VERSION: 22
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  Hedefit:
    type: application
    platform: iOS
    sources:
      - path: Hedefit
        excludes:
          - Info.plist
          - Hedefit.entitlements
          - Assets.xcassets
    info:
      path: Hedefit/Info.plist
      properties:
        HEDEFIT_API_BASE_URL: $(HEDEFIT_API_BASE_URL)
        SUPABASE_URL: $(NEXT_PUBLIC_SUPABASE_URL)
        SUPABASE_ANON_KEY: $(NEXT_PUBLIC_SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        NSLocationWhenInUseUsageDescription: Rota takibi için konumuna ihtiyacımız var.
        NSLocationAlwaysAndWhenInUseUsageDescription: Arka planda rota takibine devam edebilmek için konumuna sürekli erişim gerekiyor.
        UIBackgroundModes: [location, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.hedefit.app.sync]
        NSHealthShareUsageDescription: Adım, uyku ve kilo verilerini okumak için Sağlık uygulamasına erişim gerekiyor.
        NSHealthUpdateUsageDescription: Antrenman verilerini Sağlık uygulamasına yazmak için izin gerekiyor.
        NSCameraUsageDescription: Ekipman tanıma ve besin fotoğrafı için kameraya ihtiyacımız var.
        NSPhotoLibraryUsageDescription: Fotoğraf seçmek için galeri erişimine ihtiyacımız var.
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_URL_SCHEME)"]
    entitlements:
      path: Hedefit/Hedefit.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app
        PRODUCT_NAME: Hedefit
        INFOPLIST_KEY_CFBundleDisplayName: Hedefit
        CODE_SIGN_ENTITLEMENTS: Hedefit/Hedefit.entitlements
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
    dependencies:
      - target: HedefitWidgets
        embed: true
      - target: HedefitWatch
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
  HedefitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HedefitWidgets
    info:
      path: HedefitWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HedefitWidgets/HedefitWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app.widgets
        PRODUCT_NAME: HedefitWidgets
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
  HedefitWatch:
    type: application
    platform: watchOS
    sources:
      - path: HedefitWatch
        excludes:
          - HedefitWatch.entitlements
    info:
      path: HedefitWatch/Info.plist
      properties:
        CFBundleDisplayName: Hedefit
        WKCompanionAppBundleIdentifier: com.hedefit.app
        WKApplication: true
        NSHealthShareUsageDescription: Nabız, kalori ve mesafeyi antrenman sırasında ölçmek için Sağlık erişimi gerekiyor.
        NSHealthUpdateUsageDescription: Antrenmanını Sağlık uygulamasına kaydetmek için izin gerekiyor.
    dependencies:
      - target: HedefitWatchWidgets
        embed: true
    entitlements:
      path: HedefitWatch/HedefitWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app.watchkitapp
        PRODUCT_NAME: Hedefit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: HedefitWatch/HedefitWatch.entitlements
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
  HedefitWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: HedefitWatchWidgets
        excludes:
          - HedefitWatchWidgets.entitlements
    info:
      path: HedefitWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hedefit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HedefitWatchWidgets/HedefitWatchWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app.watchkitapp.widgets
        PRODUCT_NAME: HedefitWatchWidgets
        CODE_SIGN_ENTITLEMENTS: HedefitWatchWidgets/HedefitWatchWidgets.entitlements
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
